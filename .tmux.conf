# Modern Tmux Configuration
# Reload with: tmux source-file ~/.tmux.conf

# ------------------------------------------------------------------------------
# Prefix key
# ------------------------------------------------------------------------------
# Use backtick (`) instead of Ctrl-B
unbind C-b
set -g prefix `

# Double tap backtick to send a literal backtick
bind '`' send-keys '`'

# ------------------------------------------------------------------------------
# General settings
# ------------------------------------------------------------------------------
# Enable 256 colors and true color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback history
set -g history-limit 50000

# Faster escape time (no delay when pressing Esc in vim)
set -sg escape-time 0

# Enable mouse support (click panes, scroll with wheel, resize)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase display time for pane indicators
set -g display-panes-time 2000

# Set focus events for vim autoread
set -g focus-events on

# ------------------------------------------------------------------------------
# Vi mode and copy
# ------------------------------------------------------------------------------
# Use vi mode
setw -g mode-keys vi

# Vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Mouse selection also copies to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ------------------------------------------------------------------------------
# Window and pane splitting
# ------------------------------------------------------------------------------
# Split with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keep default splits but with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# Vim-tmux navigator (Ctrl-hjkl to navigate)
# ------------------------------------------------------------------------------
# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Restore Ctrl-L for clear screen (prefix + Ctrl-L)
bind C-l send-keys 'C-l'

# ------------------------------------------------------------------------------
# Pane resizing
# ------------------------------------------------------------------------------
# Resize with Alt-hjkl
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Fine-grained resize with prefix + arrows
bind Left resize-pane -L 2
bind Right resize-pane -R 2
bind Up resize-pane -U 2
bind Down resize-pane -D 2

# ------------------------------------------------------------------------------
# Useful keybindings
# ------------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Toggle synchronize panes (type in all panes at once)
bind S setw synchronize-panes

# ------------------------------------------------------------------------------
# Status bar
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 1

# Colors (catppuccin mocha inspired)
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Left side: session name
set -g status-left-length 30
set -g status-left '#[fg=#89b4fa,bold] #S #[default]'

# Right side: date and time
set -g status-right-length 50
set -g status-right '#[fg=#a6adc8] %Y-%m-%d #[fg=#89b4fa,bold] %H:%M '

# Window tabs
setw -g window-status-format '#[fg=#6c7086] #I:#W '
setw -g window-status-current-format '#[fg=#89b4fa,bold] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message style
set -g message-style 'bg=#313244 fg=#cdd6f4'
